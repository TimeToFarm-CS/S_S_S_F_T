<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Novel Reader</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Outfit:wght@300;400;600;700&display=swap"
        rel="stylesheet">
<link rel="stylesheet" href="/index.css">
</head>

<body class="dark-theme">
    <nav class="navbar">
        <div class="nav-content">
            <h1 class="logo" onclick="app.showNovelList()">Novel Reader</h1>
            <div class="search-box">
                <input type="text" id="globalSearch" placeholder="Search..." oninput="app.filterContent()">
                <button onclick="app.clearCache()" class="btn secondary btn-sm" title="Clear Cache">🧹</button>
            </div>
        </div>
    </nav>

    <main id="app-content">
        <!-- Novels View: List of available novels -->
        <section id="novels-view" class="view">
            <div class="view-header">
                <h2>All Novels</h2>
                <div class="stats" id="novel-stats">Loading...</div>
            </div>
            <div id="novel-list" class="novel-grid">
                <!-- Novels will be injected here -->
            </div>
        </section>

        <!-- Home View: Chapter List for a specific novel -->
        <section id="home-view" class="view hidden">
            <div class="view-header">
                <div class="breadcrumb">
                    <span onclick="app.showNovelList()" class="link">Novels</span> / <span id="current-novel-name">Novel Name</span>
                </div>
                <div class="stats" id="chapter-stats">Loading...</div>
            </div>
            <div id="chapter-list" class="chapter-grid">
                <!-- Chapters will be injected here -->
            </div>
        </section>

        <!-- Reader View: Chapter Content -->
        <section id="reader-view" class="view hidden">
            <div class="reader-controls top">
                <!-- Custom Searchable Dropdown -->
                <div class="custom-dropdown" id="chapter-dropdown-container">
                    <div class="dropdown-trigger" onclick="app.toggleDropdown()">
                        <span id="current-chapter-text">Select Chapter</span>
                        <span class="chevron">▼</span>
                    </div>
                    <div class="dropdown-menu hidden" id="dropdown-menu">
                        <div class="dropdown-search">
                            <input type="text" id="dropdownSearch" placeholder="Search chapter..."
                                oninput="app.filterDropdown()">
                        </div>
                        <div class="dropdown-items" id="dropdown-items">
                            <!-- Items injected here -->
                        </div>
                    </div>
                </div>

                <div class="nav-actions">
                    <div class="setting-group">
                        <button onclick="app.changeFontSize(-1)" class="btn secondary"
                            title="Decrease Font Size">A-</button>
                        <button onclick="app.changeFontSize(1)" class="btn secondary"
                            title="Increase Font Size">A+</button>
                    </div>
                    <button onclick="app.prevChapter()" id="btn-prev-top" class="btn secondary"
                        title="Previous">⬅️</button>
                    <button onclick="app.nextChapter()" id="btn-next-top" class="btn secondary" title="Next">➡️</button>
                    <button onclick="app.copyContent()" id="btn-copy" class="btn secondary" title="Copy">📋</button>
                </div>
            </div>

            <article class="reading-area">
                <h1 id="chapter-title">Chapter Title</h1>
                <div id="chapter-content" class="content-body">
                    <!-- Content injected here -->
                    <div class="loader">
                        <div class="spinner"></div>
                        <p>Loading Local Data...</p>
                    </div>
                </div>
            </article>

            <div class="reader-controls bottom">
                <button onclick="app.prevChapter()" id="btn-prev-bottom" class="btn secondary">⬅️ Previous</button>
                <button onclick="app.nextChapter()" id="btn-next-bottom" class="btn primary">Next Chapter ➡️</button>
            </div>
    </main>

    <button id="back-to-top" class="fab hidden" onclick="window.scrollTo({top: 0, behavior: 'smooth'})">
        ↑
    </button>
    </div>

    <script src="app.js"></script>
<script type="module" src="/index.tsx"></script>
</body>

</html>
